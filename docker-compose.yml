# SkillBridge uses an external Neon PostgreSQL database (DATABASE_URL from .env).
# A local Postgres container is kept as an optional fallback behind the "localdb"
# profile: `docker compose --profile localdb up`. To use it, point DATABASE_URL in
# .env at postgresql://skillbridge:skillbridge_dev_password@db:5432/skillbridge.
services:
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillbridge} -d ${POSTGRES_DB:-skillbridge}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_PATH: /data/skillbridge.db
    volumes:
      - sb_data:/data
    restart: unless-stopped
    expose: ["8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
volumes:
  postgres_data:
  sb_data:
